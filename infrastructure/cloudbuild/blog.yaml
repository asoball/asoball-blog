# Phase 5 only. This builds a verified candidate and deliberately does not activate Hosting.
steps:
  - name: node:22.23.4-bookworm-slim@sha256:4b150b48b4116e2a22f2c39cc27025fbf4f153e2078fd3b14d159fdb5c7279da
    entrypoint: bash
    args:
      - -ceu
      - |
        npm install --global pnpm@10.34.9
        pnpm install --frozen-lockfile
        pnpm cloud:build
    env:
      - ALLOW_CLOUD_BUILD=true
      - COMMIT_SHA=$COMMIT_SHA
      - _SOURCE_SHA=$_SOURCE_SHA
      - _RELEASE_ID=$_RELEASE_ID
      - _SNAPSHOT_URI=$_SNAPSHOT_URI
      - _SNAPSHOT_SHA256=$_SNAPSHOT_SHA256
      - SITE_URL=$_SITE_URL
options:
  logging: CLOUD_LOGGING_ONLY
timeout: 1200s
artifacts:
  objects:
    location: gs://${_CANDIDATE_BUCKET}/candidates/${_RELEASE_ID}/
    paths: [.local/cloud-candidate/site/**, .local/cloud-candidate/candidate.json]
